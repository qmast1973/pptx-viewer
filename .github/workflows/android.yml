name: Android APK

# 웹 화면·안드로이드 코드가 바뀌면 APK 를 다시 만들어 Releases(android-latest)에 올린다. 웹앱의 'APK 받기' 링크가 이 파일을 가리킨다.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "vendor/pptx-vanilla-viewer.bundle.js"
      - "icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 서명 키 확인
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::저장소 Settings → Secrets and variables → Actions 에 ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD 를 등록한 뒤 다시 실행하세요."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/pv.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 웹 파일을 앱 안에 넣기
        run: |
          W=android/app/src/main/assets/www
          mkdir -p "$W/vendor"
          cp index.html "$W/"
          cp vendor/pptx-vanilla-viewer.bundle.js "$W/vendor/"
          cp -r icons "$W/"

      - name: APK 빌드
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/pv.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pptx-viewer.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest pptx-viewer.apk --latest \
            --title "슬라이드 찾기 안드로이드 앱" \
            --notes "빌드 ${{ github.run_number }} (${GITHUB_SHA::7}). 폰에서 이 APK 를 받아 설치하세요. 파일 앱의 .pptx 를 눌렀을 때 '슬라이드 찾기'로 열 수 있습니다."
