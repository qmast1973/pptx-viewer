<meta charset="utf-8">
<title>슬라이드 찾기 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 위 도구줄(열기·찾기) → 슬라이드 한 장 → 쪽 넘김 → 찾기 결과 목록. 폰 세로 화면 기준 한 줄 흐름 */
:root {
  --bg: #eef1f4; --surface: #ffffff; --fg: #1d2630; --muted: #5d6b79; --line: #d3dae1;
  --accent: #1f5f8b; --accent-fg: #ffffff; --mark: #ffd84d; --mark-line: #e0a800;
  --stage: #2b3540;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --surface: #1b232b; --fg: #e4eaf0; --muted: #94a3b1; --line: #2e3a46;
  --accent: #6fb3e0; --accent-fg: #0d1b26; --mark: #ffd84d; --mark-line: #ffc400; --stage: #0b0f13; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1b232b; --fg: #e4eaf0; --muted: #94a3b1; --line: #2e3a46;
  --accent: #6fb3e0; --accent-fg: #0d1b26; --mark: #ffd84d; --mark-line: #ffc400; --stage: #0b0f13; color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 12px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.file { flex: 1 1 200px; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 9px 14px; cursor: pointer; min-height: 42px; }
button:focus-visible, input:focus-visible, .btn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn { display: inline-flex; align-items: center; position: relative; }
/* 손가락이 진짜 파일 입력칸을 직접 누르도록 버튼 전체를 덮는다 (label 탭을 무시하는 폰 화면 대비) */
.btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-height: 42px; }
.viewer { display: flex; flex-direction: column; gap: 10px; }
/* 슬라이드 칸: 확대하면 칸 안에서 위아래·좌우로 밀어 본다. 두 손가락 확대는 페이지 대신 슬라이드만 (직접 처리) */
.stage { background: var(--stage); border-radius: 10px; padding: 8px; position: relative; overflow: auto;
  touch-action: pan-x pan-y; overscroll-behavior: contain; }
.slide { position: relative; margin: 0 auto; }
.zoombar { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.zoombar .count { min-width: 4.2em; text-align: center; }
/* 전체화면: 브라우저 전체화면(:fullscreen) 또는 지원 안 되는 폰(아이폰 등)에서는 화면을 덮는 방식(.full) */
.viewer:fullscreen, .viewer.full { position: fixed; inset: 0; z-index: 50; background: var(--stage); gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.viewer:fullscreen .stage, .viewer.full .stage { flex: 1; min-height: 0; border-radius: 0; padding: 0; display: flex; }
.viewer:fullscreen .slide, .viewer.full .slide { margin: auto; flex-shrink: 0; }
.viewer:fullscreen .count, .viewer.full .count { color: #c9d3dc; }
/* 전체화면에서는 아래 버튼줄을 숨기고 오른쪽 위 쪽 번호 + ⋮ 메뉴만 둔다 */
.viewer:fullscreen .pager, .viewer.full .pager, .viewer:fullscreen .zoombar, .viewer.full .zoombar { display: none; }
.fsbar { display: none; }
.viewer:fullscreen .fsbar, .viewer.full .fsbar { display: flex; align-items: center; gap: 8px; position: absolute; z-index: 5;
  top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); }
.fsbar .count { background: rgb(0 0 0 / .55); color: #fff; border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.more { width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; border: 0;
  background: rgb(0 0 0 / .55); color: #fff; font-size: 22px; line-height: 1; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 200px; display: flex; flex-direction: column;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  box-shadow: 0 8px 24px rgb(0 0 0 / .35); }
.menu button { border: 0; background: transparent; text-align: left; border-radius: 6px; min-height: 44px; }
.menu button:hover, .menu button:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }
.slide canvas { display: block; width: 100%; height: auto; background: #fff; border-radius: 3px; }
.hit { position: absolute; border: 3px solid var(--mark-line); background: color-mix(in srgb, var(--mark) 30%, transparent);
  border-radius: 4px; pointer-events: none; }
.hit.now { box-shadow: 0 0 0 4px color-mix(in srgb, var(--mark) 55%, transparent); }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 14px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.count { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); }
.results { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.results h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 12px 14px;
  border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.results ol { list-style: none; margin: 0; padding: 0; }
.results li button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  background: transparent; display: grid; grid-template-columns: 3.2em 1fr; gap: 10px; padding: 12px 14px; }
.results li:last-child button { border-bottom: 0; }
.results li button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.no { font-family: var(--f-num); color: var(--accent); font-weight: 600; }
.ex { min-width: 0; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
.ex b { color: var(--fg); }
mark { background: var(--mark); color: #1d2630; border-radius: 2px; padding: 0 1px; }
.empty { padding: 14px; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .hit { transition: box-shadow .2s; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">

<div class="wrap">
  <div class="bar">
    <label class="btn primary" for="fileIn">파일 열기<input id="fileIn" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation"></label>
    <div class="file" id="fileName">예시 발표자료</div>

  <div class="viewer" id="viewer">

</div>

<!-- 오픈소스 pptx-browser 4.1.5 (MIT, 글자색 1곳 수정 — vendor/pptx-browser-4.1.5/PATCH.md) 를 묶어 넣음 -->
<script>__BUNDLE__</script>
<script type="module">
const { PptxRenderer } = window.PPTX;

const SAMPLE_B64 = "__SAMPLE_B64__";
const $ = (id) => document.getElementById(id);
const cv = $("cv"), slideBox = $("slide"), status = $("status");
let r = null, cur = 0, hits = [], hitPos = -1, query = "", busy = Promise.resolve();
let zoom = 1;                                   // 1 = 칸에 맞춤, 최대 5배
const ZMIN = 1, ZMAX = 5, stage = $("stage"), viewer = $("viewer");

function showStatus(t) { status.textContent = t; status.hidden = !t; }

async function open(data, name) {
  showStatus("불러오는 중…");
  hits = []; hitPos = -1; query = ""; $("q").value = ""; $("results").hidden = true;
  try {
    r?.destroy();
    r = new PptxRenderer();
    await r.load(data);
    $("fileName").textContent = name;
    await go(0);
  } catch (e) {
    r = null;
    showStatus("이 파일을 열지 못했습니다. .pptx 파일인지 확인하세요. (" + (e?.message || e) + ")");
    $("count").textContent = "– / –";
  }
}

function go(i) {
  busy = busy.then(async () => {
    if (!r || !r.slideCount) return;
    cur = Math.max(0, Math.min(r.slideCount - 1, i));
    sizeSlide();
    await r.renderSlide(cur, cv, Math.min(4096, Math.round(slideBox.clientWidth * (window.devicePixelRatio || 1)) || 1280));
    showStatus("");
    $("count").textContent = `${cur + 1} / ${r.slideCount}`;
    $("fsCount").textContent = `${cur + 1} / ${r.slideCount}` + (zoom > 1.01 ? ` · ${Math.round(zoom * 100)}%` : "");
    $("prev").disabled = cur === 0; $("next").disabled = cur === r.slideCount - 1;
    drawHits();
    for (const b of $("resList").querySelectorAll("button")) b.setAttribute("aria-current", String(+b.dataset.i === cur));
  });
  return busy;
}

// ── 크기·확대·전체화면 ─────────────────────────────────────
function isFull() { return document.fullscreenElement === viewer || viewer.classList.contains("full"); }
function fitWidth() {                           // 확대 1배일 때 슬라이드 폭: 칸 폭, 전체화면이면 높이에도 맞춤
  const cs = getComputedStyle(stage);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (!r || !isFull()) return w;
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  return Math.min(w, h * r.slideSize.cx / r.slideSize.cy);
}
function sizeSlide() {
  const fw = fitWidth();
  slideBox.style.width = Math.max(50, Math.floor(fw * zoom)) + "px";
  // 보통 화면: 칸 높이는 맞춤(1배) 크기로 고정하고, 확대한 부분은 칸 안에서 밀어 본다
  const cs = getComputedStyle(stage);
  stage.style.height = isFull() || !r ? "" : Math.ceil(fw * r.slideSize.cy / r.slideSize.cx + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)) + "px";
  $("zoomLv").textContent = Math.round(zoom * 100) + "%";
  $("zoomOut").disabled = zoom <= ZMIN; $("zoomIn").disabled = zoom >= ZMAX;
}
// 확대: 기준점(cx, cy — 칸 안 좌표)이 화면에서 제자리에 있도록 스크롤을 맞춘다. 화면은 바로 늘리고 선명한 다시 그리기는 잠시 뒤
let zt;
function setZoom(z, cx = stage.clientWidth / 2, cy = stage.clientHeight / 2) {
  z = Math.min(ZMAX, Math.max(ZMIN, z));
  if (Math.abs(z - zoom) < 0.001) return;
  const k = z / zoom, sx = stage.scrollLeft + cx, sy = stage.scrollTop + cy;
  zoom = z; sizeSlide();
  stage.scrollLeft = sx * k - cx; stage.scrollTop = sy * k - cy;
  clearTimeout(zt); zt = setTimeout(() => go(cur), 250);
}
async function toggleFull() {
  if (isFull()) {
    if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
    viewer.classList.remove("full");
  } else {
    try { await viewer.requestFullscreen(); } catch { viewer.classList.add("full"); }
  }
  afterFull();
}
function afterFull() {
  closeMenu();
  $("fullBtn").textContent = isFull() ? "전체화면 끝" : "전체화면";
  document.body.style.overflow = viewer.classList.contains("full") ? "hidden" : "";
  zoom = 1; stage.scrollTo(0, 0);
  setTimeout(() => go(cur), 80);
}

// ── 전체화면 ⋮ 메뉴 ─────────────────────────────────────────
function closeMenu() { $("menu").hidden = true; $("moreBtn").setAttribute("aria-expanded", "false"); }
function openMenu() {
  for (const b of $("menu").querySelectorAll("[data-hits]")) b.hidden = hits.length < 1;
  $("menu").hidden = false; $("moreBtn").setAttribute("aria-expanded", "true");
  $("menu").querySelector("button:not([hidden])").focus();
}
async function menuAct(act) {
  closeMenu();
  if (act === "search") {                       // 전체화면을 끝내고 찾기 칸으로
    if (isFull()) await toggleFull();
    $("q").focus(); $("q").select(); $("searchForm").scrollIntoView({ block: "start" });
  } else if (act === "hitPrev") stepHit(-1);
  else if (act === "hitNext") stepHit(1);
  else if (act === "prev") go(cur - 1);
  else if (act === "next") go(cur + 1);
  else if (act === "zoomIn") setZoom(zoom * 1.25);
  else if (act === "zoomOut") setZoom(zoom / 1.25);
  else if (act === "fit") setZoom(1);
  else if (act === "exit" && isFull()) toggleFull();
}

// 찾은 글자가 들어 있는 글상자 위치(슬라이드 XML 의 a:off/a:ext, EMU)에 표시. 위치가 레이아웃에서 상속된 글상자는 목록에만 나온다.
function boxesFor(i, q) {
  const xml = new TextDecoder().decode(r._files[r.slidePaths[i]]);
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const out = [];
  for (const sp of doc.getElementsByTagNameNS("*", "sp")) {
    const text = [...sp.getElementsByTagNameNS("*", "t")].map((t) => t.textContent).join("");
    if (!text.toLowerCase().includes(q)) continue;
    const off = sp.getElementsByTagNameNS("*", "off")[0], ext = sp.getElementsByTagNameNS("*", "ext")[0];
    if (!off || !ext || sp.parentElement?.localName === "grpSp") continue;
    out.push({ x: +off.getAttribute("x"), y: +off.getAttribute("y"), w: +ext.getAttribute("cx"), h: +ext.getAttribute("cy") });
  }
  return out;
}

function drawHits() {
  slideBox.querySelectorAll(".hit").forEach((n) => n.remove());
  if (!query || !r) return;
  const { cx, cy } = r.slideSize;
  for (const b of boxesFor(cur, query)) {
    const d = document.createElement("div");
    d.className = "hit now";
    Object.assign(d.style, { left: (b.x / cx * 100) + "%", top: (b.y / cy * 100) + "%", width: (b.w / cx * 100) + "%", height: (b.h / cy * 100) + "%" });
    slideBox.append(d);
  }
}

// 슬라이드의 문단(a:p) 글자 목록 — 찾기는 문단 단위 (tools/search.mjs 와 같은 기준)
function paragraphs(i) {
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(r._files[r.slidePaths[i]]), "application/xml");
  return [...doc.getElementsByTagNameNS("*", "p")].filter((p) => p.namespaceURI?.includes("drawingml"))
    .map((p) => [...p.getElementsByTagNameNS("*", "t")].map((t) => t.textContent).join("")).filter((s) => s.trim());
}

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function search(q) {
  query = q.trim().toLowerCase();
  const list = $("resList"); list.replaceChildren();
  if (!r || !query) { $("results").hidden = true; drawHits(); return; }
  hits = [];
  for (let i = 0; i < r.slideCount; i++) {
    const ps = paragraphs(i), found = ps.filter((p) => p.toLowerCase().includes(query));
    if (found.length) hits.push({ slideIndex: i, title: ps[0] || "", lines: found.slice(0, 3), more: found.length - 3 });
  }
  $("results").hidden = false;
  $("resTitle").textContent = hits.length ? `"${q.trim()}" — ${hits.length}개 슬라이드에서 찾음` : `"${q.trim()}" — 찾지 못했습니다`;
  $("hitPrev").disabled = $("hitNext").disabled = hits.length < 2;
  if (!hits.length) { list.innerHTML = '<li class="empty">다른 낱말로 찾아 보세요. 띄어쓰기도 그대로 맞춰 찾습니다.</li>'; drawHits(); return; }
  for (const h of hits) {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.dataset.i = h.slideIndex;
    const mk = (s) => { const k = s.toLowerCase().indexOf(query); return esc(s.slice(0, k)) + "<mark>" + esc(s.slice(k, k + query.length)) + "</mark>" + esc(s.slice(k + query.length)); };
    const ex = h.lines.map(mk).join("<br>") + (h.more > 0 ? `<br>… 외 ${h.more}곳` : "");
    b.innerHTML = `<span class="no">${h.slideIndex + 1}쪽</span><span class="ex">${h.lines[0] !== h.title ? `<b>${esc(h.title)}</b><br>` : ""}${ex}</span>`;
    b.addEventListener("click", () => { hitPos = hits.indexOf(h); go(h.slideIndex); slideBox.scrollIntoView({ block: "nearest" }); });
    li.append(b); list.append(li);
  }
  hitPos = Math.max(0, hits.findIndex((h) => h.slideIndex >= cur));
  await go(hits[hitPos].slideIndex);
}

function stepHit(d) { if (!hits.length) return; hitPos = (hitPos + d + hits.length) % hits.length; go(hits[hitPos].slideIndex); }

// 파일 고르기: 고르는 창에는 .pptx 만 보이게 하고(accept, 2026-10-20 사용자 요청), 끌어다 놓기 등으로 들어온 파일은 여기서 한 번 더 확인한다
function pick(f) {
  if (!f) return;
  if (!/\.pptx$/i.test(f.name)) { showStatus(`"${f.name}" 은(는) .pptx 파일이 아닙니다. .pptx 파일을 골라 주세요.`); return; }
  open(f, f.name);
}
$("fileIn").addEventListener("change", (e) => { pick(e.target.files[0]); e.target.value = ""; });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); pick(e.dataTransfer?.files?.[0]); });
$("searchForm").addEventListener("submit", (e) => { e.preventDefault(); search($("q").value); $("q").blur(); });
$("prev").addEventListener("click", () => go(cur - 1));
$("zoomIn").addEventListener("click", () => setZoom(zoom * 1.25));
$("zoomOut").addEventListener("click", () => setZoom(zoom / 1.25));
$("zoomFit").addEventListener("click", () => setZoom(1));
$("fullBtn").addEventListener("click", toggleFull);
$("moreBtn").addEventListener("click", (e) => { e.stopPropagation(); $("menu").hidden ? openMenu() : closeMenu(); });
$("menu").addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b) menuAct(b.dataset.act); });
document.addEventListener("click", (e) => { if (!$("menu").hidden && !e.target.closest("#fsbar")) closeMenu(); });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) viewer.classList.remove("full"); afterFull(); });
stage.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const b = stage.getBoundingClientRect();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX - b.left, e.clientY - b.top);
}, { passive: false });
$("next").addEventListener("click", () => go(cur + 1));
$("hitPrev").addEventListener("click", () => stepHit(-1));
$("hitNext").addEventListener("click", () => stepHit(1));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1);
  if (e.key === "ArrowRight" || e.key === "PageDown") go(cur + 1);
  if (e.key === "+" || e.key === "=") setZoom(zoom * 1.25);
  if (e.key === "-") setZoom(zoom / 1.25);
  if (e.key === "0") setZoom(1);
  if (e.key === "f" || e.key === "F") toggleFull();
  if (e.key === "Escape" && !$("menu").hidden) { closeMenu(); $("moreBtn").focus(); return; }
  if (e.key === "Escape" && viewer.classList.contains("full")) toggleFull();
});
// 터치: 한 손가락 좌우 밀기 = 쪽 넘김(확대 안 했을 때만), 두 손가락 = 확대·축소
let sx = null, pinch = null;
const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
stage.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    const b = stage.getBoundingClientRect();
    pinch = { d: dist(e.touches), z: zoom, cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - b.left,
              cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - b.top };
    sx = null;
  } else if (e.touches.length === 1 && zoom <= 1.01) sx = e.touches[0].clientX;
}, { passive: true });
stage.addEventListener("touchmove", (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  setZoom(pinch.z * dist(e.touches) / pinch.d, pinch.cx, pinch.cy);
}, { passive: false });
stage.addEventListener("touchend", (e) => {
  if (e.touches.length < 2) pinch = null;
  if (sx === null || e.touches.length) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => go(cur), 200); });

// 에이전트·시험용 조작 (headless): window.pptxViewer.search("매출") 등
window.pptxViewer = { open, search, go, setZoom, toggleFull, menu: menuAct,
  get state() { return { slide: cur, count: r?.slideCount || 0, query, hits: hits.map((h) => h.slideIndex), zoom: +zoom.toFixed(2), full: isFull() }; } };

const bin = Uint8Array.from(atob(SAMPLE_B64), (c) => c.charCodeAt(0));
open(bin, "예시 발표자료 (파일 열기로 내 .pptx 를 여세요)");
</script>
