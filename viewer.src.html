<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* 레이아웃 (2026-10-20, christophervr.github.io/ooxml/pptx 의 앱 화면 참고):
   위 제목줄(파일 이름·찾기·열기) → [가운데: 슬라이드(왼쪽 썸네일 포함) + 아래 상태줄 | 오른쪽 찾기 결과]
   폰(900px 미만)은 한 줄: 제목줄 → 슬라이드 → 썸네일(가로 줄) → 상태줄 → 찾기 결과.
   슬라이드는 오픈소스 pptx-vanilla-viewer(Apache-2.0)가 진짜 HTML 글자로 그린다. */
:root {
  --bg: #16181c; --chrome: #1f2227; --panel: #24282e; --raise: #2c3138; --line: #363b43;
  --fg: #e8eaed; --muted: #9aa1ab; --accent: #e8673c; --accent-fg: #ffffff; --accent-soft: rgb(232 103 60 / .16);
  --canvas: #111316; --mark: #ffd84d; --mark-line: #ffc400;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; }
img { max-width: 100%; }
button, .btn { font: inherit; color: var(--fg); background: var(--raise); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 12px; min-height: 38px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover:not(:disabled), .btn:hover { border-color: #4a515b; }
button:focus-visible, input:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.ghost { background: transparent; border-color: transparent; }
.ico { width: 38px; padding: 0; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── 제목줄 ── */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--chrome); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.badge { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; flex: none; }
.doc { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.file { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 12px; color: var(--muted); }
.search { flex: 1 1 320px; max-width: 520px; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 4px 0 10px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: transparent; border: 0; outline: 0; padding: 8px 2px; min-height: 36px; }
.search button { min-height: 30px; padding: 4px 12px; }
.btn { position: relative; }
/* 손가락이 진짜 파일 입력칸을 직접 누르도록 버튼 전체를 덮는다 (label 탭을 무시하는 폰 화면 대비) */
.btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

/* ── 앱 설치 버튼·안내 ── */
.install { white-space: nowrap; }
@media (max-width: 599px) { .install { width: 38px; padding: 0; } .install .itxt { display: none; } }
dialog.help { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 20px; max-width: min(420px, calc(100vw - 32px));
  box-shadow: 0 20px 50px rgb(0 0 0 / .6); }
dialog.help::backdrop { background: rgb(0 0 0 / .55); }
dialog.help h3 { margin: 0 0 10px; font-size: 17px; }
dialog.help ol { margin: 0 0 16px; padding-left: 20px; line-height: 1.8; color: var(--muted); }
dialog.help ol b { color: var(--fg); }
dialog.help .row { display: flex; justify-content: flex-end; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90;
  background: var(--panel); border: 1px solid var(--line); color: var(--fg); padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .5); }

/* ── 본문 2단 ── */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "main results"; min-height: 0; }
.app.nores { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main"; }
.main { grid-area: main; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }

/* ── 슬라이드 칸 (전체화면 대상) ── */
.viewer { display: flex; flex-direction: column; position: relative; flex: 1; min-height: 0; }
.stage { position: relative; flex: 1; min-height: 240px; background: var(--canvas); touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; }
/* 슬라이드 보는 칸만 손가락 움직임을 전부 이 화면이 처리한다(핀치·밀기). 칸 바깥(.stage)까지 none 이면 안쪽 썸네일 목록이 못 밀리므로 여기만 막는다 */
.stage .pptxv-viewport, .stage .pptxv-viewport * { touch-action: none !important; }
.stage .pptxv-thumbs, .stage .pptxv-thumbs * { touch-action: pan-x pan-y !important; }   /* 썸네일 줄은 손가락으로 밀어 넘길 수 있게 */
.status { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; color: #fff; font-size: 14px; text-align: center; padding: 20px; background: var(--canvas); }
/* 오픈소스 뷰어 안쪽 손질: 발표자 노트 줄 숨김, 썸네일 줄 색 맞춤 (폰은 아래 가로 줄, 전체화면은 숨김) */
/* 뷰어 뿌리 상자를 칸 전체에 고정 (폰에서는 스스로 높이를 잡지 못해 42px 로 쪼그라들었음) */
.stage > .pptxv { position: absolute; inset: 0; width: auto !important; height: auto !important; --pptx-accent: var(--accent); }
.stage .pptxv-notes { display: none !important; }
.stage .pptxv-thumbs { background: var(--chrome); border-right: 1px solid var(--line); }
/* 찾은 글자: 글자 자체를 노랗게(지원 브라우저), 그 글상자는 노란 테두리 */
::highlight(pv-hit) { background-color: #ffd84d; color: #1d2630; }
.stage .pptxv-element.pv-hit { outline: 3px solid var(--mark-line); outline-offset: 3px; border-radius: 3px; box-shadow: 0 0 0 7px rgb(255 216 77 / .28); }

/* ── 아래 상태줄: 쪽 넘김 · 확대 ── */
.statusbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--chrome);
  border-top: 1px solid var(--line); padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.pager, .zoombar { display: flex; align-items: center; gap: 4px; }
.count { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 4.6em; text-align: center; }

/* ── 오른쪽 위 떠 있는 버튼들: 보통 화면은 [전체화면] 아이콘만, 전체화면은 쪽 번호 + 찾기 + [전체화면 끝] + ⋮ ── */
.fsbar { display: flex; align-items: center; gap: 8px; position: absolute; z-index: 5; top: 12px; right: 18px; }
.fsbar .count, .fsbar .more:not(.fs) { display: none; }
.more { width: 42px; height: 42px; min-height: 0; padding: 0; border-radius: 50%; border: 0; background: rgb(0 0 0 / .55); color: #fff; font-size: 22px; line-height: 1; }
.more:hover:not(:disabled) { background: rgb(0 0 0 / .75); }
.more svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.more .ico-exit { display: none; }
.fsbar .count { background: rgb(0 0 0 / .55); color: #fff; border-radius: 99px; padding: 6px 12px; min-width: 0; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 210px; display: flex; flex-direction: column; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 12px 32px rgb(0 0 0 / .5); }
.menu button { border: 0; background: transparent; justify-content: flex-start; border-radius: 6px; min-height: 42px; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.fssearch { display: none; }

/* ── 전체화면 ── */
.viewer:fullscreen, .viewer.full { position: fixed; inset: 0; z-index: 50; background: #000;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.viewer:fullscreen .stage, .viewer.full .stage { height: auto !important; background: #000; }
.viewer:fullscreen .stage .pptxv-thumbs, .viewer.full .stage .pptxv-thumbs { display: none; }
.viewer:fullscreen .fsbar, .viewer.full .fsbar { top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); }
.viewer:fullscreen .fsbar .count, .viewer.full .fsbar .count, .viewer:fullscreen .fsbar .more, .viewer.full .fsbar .more { display: inline-flex; }
.viewer:fullscreen .more .ico-enter, .viewer.full .more .ico-enter { display: none; }
.viewer:fullscreen .more .ico-exit, .viewer.full .more .ico-exit { display: block; }
.viewer:fullscreen .fssearch:not([hidden]), .viewer.full .fssearch:not([hidden]) { display: flex; gap: 6px; align-items: center; position: absolute; z-index: 6;
  top: calc(max(10px, env(safe-area-inset-top, 0px)) + 52px); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  max-width: 640px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgb(0 0 0 / .5); }
.fssearch input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-height: 40px; }
.fssearch button { min-height: 40px; padding: 6px 10px; }
.fssearch .hitn { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }

/* ── 오른쪽 찾기 결과 ── */
.results { grid-area: results; background: var(--chrome); border-left: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; }
.results h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 14px;
  border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.results h2 .nav { display: flex; gap: 4px; }
.results h2 .nav button { min-height: 30px; padding: 3px 9px; font-size: 12px; }
.results ol { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.results li button { width: 100%; text-align: left; justify-content: flex-start; align-items: start; border: 0; border-radius: 8px; background: transparent;
  display: grid; grid-template-columns: 3em 1fr; gap: 8px; padding: 10px; }
.results li button:hover { background: var(--raise); }
.results li button[aria-current="true"] { background: var(--accent-soft); }
.no { font-family: var(--f-num); color: var(--accent); font-weight: 600; }
.ex { min-width: 0; color: var(--muted); line-height: 1.55; overflow-wrap: anywhere; }
.ex b { color: var(--fg); font-weight: 600; }
mark { background: var(--mark); color: #1d2630; border-radius: 2px; padding: 0 1px; }
.empty { padding: 14px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin: 0; padding-block: 10px 18px; background: var(--bg);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

/* ── PC: 화면 한 장에 꼭 맞게 ── */
@media (min-width: 900px) {
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .app, .app.nores { flex: 1; min-height: 0; }
  .main, .results { min-height: 0; }
  .hint { padding-block: 6px; border-top: 1px solid var(--line); background: var(--chrome); }
}
/* ── 폰·좁은 화면: 한 줄로 쌓기 ── */
@media (max-width: 899px) {
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .app, .app.nores { display: flex; flex-direction: column; }
  .main { order: 1; }
  .results { order: 3; border-left: 0; border-top: 1px solid var(--line); }
  /* 폰 보통 화면: 썸네일은 PC(크롬)처럼 슬라이드 왼쪽 세로 줄 (2026-10-21 사용자 요청: 아래 가로 줄 → 크롬과 같게). 폭 THUMB_W 84px, 세로로 밀어 넘김. 전체화면에서는 위 규칙으로 숨김.
     라이브러리 자체 CSS 가 폰에서 썸네일을 display:none 하므로 flex !important 로 덮는다. */
  .viewer:not(.full):not(:fullscreen) .stage .pptxv-body { flex-direction: row; }
  .viewer:not(.full):not(:fullscreen) .stage .pptxv-thumbs { display: flex !important; width: 84px !important; flex: none; border-right: 1px solid var(--line); flex-direction: column; }
  .viewer:not(.full):not(:fullscreen) .stage .pptxv-thumbs-list { flex: 1; overflow-y: auto !important; overflow-x: hidden !important; padding: 6px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .zoombar .ztxt { display: none; }
  /* 폰 보통 화면: 칸 높이는 sizeStage() 가 슬라이드 비율로 정한 값 그대로 (flex 로 늘이거나 줄이지 않음) */
  .viewer:not(.full):not(:fullscreen) .stage { flex: none; min-height: 160px; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">

<header class="topbar">
  <div class="badge" aria-hidden="true">P</div>
  <div class="doc">
    <span class="file" id="fileName">예시 발표자료</span>
    <span class="sub" id="docSub">슬라이드 찾기 뷰어</span>
  </div>
  <form class="search" id="searchForm" role="search">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="슬라이드에서 찾기" autocomplete="off" enterkeyhint="search" aria-label="슬라이드에서 찾기">
    <button class="primary" type="submit">찾기</button>
  </form>
  <button class="install" id="installBtn" type="button" hidden title="이 기기에 앱으로 설치" aria-label="앱 설치">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="itxt">앱 설치</span>
  </button>
  <label class="btn" for="fileIn">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    파일 열기<input id="fileIn" type="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation">
  </label>
</header>

<div class="app nores" id="app">
  <main class="main">
    <div class="viewer" id="viewer">
      <div class="stage" id="stage"></div>
      <div class="status" id="status">불러오는 중…</div>
      <div class="fsbar" id="fsbar">
        <span class="count" id="fsCount">– / –</span>
        <button class="more" id="fsFindBtn" type="button" aria-label="찾기" title="찾기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="more fs" id="fullBtn" type="button" aria-label="전체화면" title="전체화면">
          <svg class="ico-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="ico-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
        <button class="more" id="moreBtn" type="button" aria-label="메뉴" aria-haspopup="menu" aria-expanded="false">⋮</button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="find">찾기</button>
          <button type="button" role="menuitem" data-act="search">찾기 결과 목록 보기 (전체화면 끝)</button>
          <button type="button" role="menuitem" data-act="hitPrev" data-hits>이전 결과</button>
          <button type="button" role="menuitem" data-act="hitNext" data-hits>다음 결과</button>
          <hr>
          <button type="button" role="menuitem" data-act="prev">이전 쪽</button>
          <button type="button" role="menuitem" data-act="next">다음 쪽</button>
          <hr>
          <button type="button" role="menuitem" data-act="zoomIn">확대</button>
          <button type="button" role="menuitem" data-act="zoomOut">축소</button>
          <button type="button" role="menuitem" data-act="fit">화면에 맞춤</button>
          <hr>
          <button type="button" role="menuitem" data-act="exit">전체화면 끝</button>
        </div>
      </div>
      <form class="fssearch" id="fsSearch" role="search" hidden>
        <input id="fsQ" type="search" placeholder="슬라이드에서 찾기" autocomplete="off" enterkeyhint="search" aria-label="전체화면에서 찾기">
        <button class="primary" type="submit">찾기</button>
        <span class="hitn" id="fsHitN"></span>
        <button type="button" id="fsHitPrev" aria-label="이전 결과">◀</button>
        <button type="button" id="fsHitNext" aria-label="다음 결과">▶</button>
        <button type="button" id="fsFindClose" aria-label="찾기 닫기">✕</button>
      </form>
    </div>
    <div class="statusbar">
      <div class="pager">
        <button class="ghost ico" id="prev" type="button" aria-label="이전 슬라이드" title="이전 슬라이드">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span class="count" id="count">– / –</span>
        <button class="ghost ico" id="next" type="button" aria-label="다음 슬라이드" title="다음 슬라이드">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="zoombar">
        <button class="ghost ico" id="zoomOut" type="button" aria-label="축소" title="축소" disabled>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
        </button>
        <span class="count" id="zoomLv">100%</span>
        <button class="ghost ico" id="zoomIn" type="button" aria-label="확대" title="확대">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
        </button>
        <button class="ghost" id="zoomFit" type="button" title="화면에 맞춤">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.5"/><path d="M9 10l-2 2 2 2M15 10l2 2-2 2"/></svg><span class="ztxt">맞춤</span>
        </button>
      </div>
    </div>
  </main>
  <aside class="results" id="results" hidden>
    <h2><span id="resTitle"></span><span class="nav"><button id="hitPrev" type="button">이전 결과</button><button id="hitNext" type="button">다음 결과</button></span></h2>
    <ol id="resList"></ol>
  </aside>
</div>
<dialog class="help" id="installHelp" aria-labelledby="installHelpTitle">
  <h3 id="installHelpTitle">앱으로 설치하기</h3>
  <ol id="installSteps"></ol>
  <div class="row"><button class="primary" type="button" id="installHelpClose">확인</button></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<p class="hint">.pptx 파일만 열 수 있습니다(PC에서는 파일을 끌어다 놓아도 됩니다). 파일은 이 기기 안에서만 읽고 어디로도 보내지 않습니다. 화면을 좌우로 밀어도 넘어갑니다. 두 손가락 핀치·더블 탭으로 확대하고 드래그로 이동할 수 있습니다. PC에서는 Ctrl+휠·＋/－ 키로 확대하고 F 키는 전체화면입니다. 슬라이드 표시: pptx-viewer(Apache-2.0).</p>

<!-- 찾기용 파일 읽기: pptx-browser 4.1.5 (MIT, vendor/pptx-browser-4.1.5/PATCH.md) — 이제 그리지는 않고 슬라이드 XML 만 읽는다 -->
<script>__BUNDLE__</script>
<!-- 슬라이드 표시: pptx-vanilla-viewer 3.42.0 (Apache-2.0, vendor/pptx-vanilla-viewer-3.42.0/NOTICE) -->
<script src="vendor/pptx-vanilla-viewer.bundle.js"></script>
<script type="module">
const { PptxRenderer } = window.PPTX;
const PVV = window.PVV;

const SAMPLE_B64 = "__SAMPLE_B64__";
const $ = (id) => document.getElementById(id);
const status = $("status"), stage = $("stage"), viewer = $("viewer");
let parser = null, pv = null, count = 0, cur = 0, hits = [], hitPos = -1, query = "", hlCount = 0;
let zoom = 1, fit = 1;                          // zoom 1 = 칸에 맞춤 (fit = 그때 뷰어의 실제 배율), 최대 5배
const ZMIN = 1, ZMAX = 5, FIT_PAD = 12, THUMB_W = 84, MIN_STAGE_H = 320;   // 폰 썸네일 줄 폭 (CSS 와 같게) / 칸 최소 높이(썸네일 목록이 밀릴 만큼)

// ── 마지막으로 연 파일 기억 (브라우저 IndexedDB, 기기 안에만 저장) ─────────
let lastSaved = "", curName = "";
const name_ = () => curName;
const idb = () => new Promise((ok, ng) => {
  const r = indexedDB.open("pv-last", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
});
async function idbPut(k, v) { try { const db = await idb(); await new Promise((ok, ng) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = () => ng(t.error); }); db.close(); return true; } catch { return false; } }
async function idbGet(k) { try { const db = await idb(); const v = await new Promise((ok, ng) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ng(q.error); }); db.close(); return v; } catch { return undefined; } }
async function saveLast(bytes, name, slide) { curName = name; lastSaved = ""; if (await idbPut("last", { name, bytes, slide, at: Date.now() })) lastSaved = name; }
function saveSlide(i) { idbGet("last").then((r) => { if (r && r.name === lastSaved) idbPut("last", { ...r, slide: i }); }); }
async function openLast() {
  const r = await idbGet("last");
  if (!r?.bytes) return false;
  await open(new Uint8Array(r.bytes), r.name, { restore: r.slide || 0 });
  toast(`방금 보던 파일을 다시 열었습니다: ${r.name}`);
  return true;
}

function showStatus(t) { status.textContent = t; status.hidden = !t; }
function showResults(on) { $("results").hidden = !on; $("app").classList.toggle("nores", !on); }

async function open(data, name, opts = {}) {
  showStatus("불러오는 중…"); curName = lastSaved = "";
  hits = []; hitPos = -1; query = ""; $("q").value = ""; showResults(false); zoom = 1;
  try {
    const bytes = data instanceof Uint8Array ? data : new Uint8Array(await data.arrayBuffer());
    parser?.destroy(); parser = new PptxRenderer(); await parser.load(bytes);   // 찾기용 (그리지 않음)
    count = parser.slideCount; cur = 0;
    sizeStage();
    pv?.destroy(); stage.replaceChildren();
    await new Promise((ok, ng) => {
      const to = setTimeout(() => ng(new Error("시간 초과")), 60000);
      pv = PVV.createPptxViewer(stage, {
        source: bytes.slice(), fileName: name, theme: PVV.vermilionDarkTheme, locale: "en",
        editable: false, autosave: false, showToolbar: false, showThumbnails: true, showCompatibilityToasts: false,
        fitPadding: FIT_PAD, maxFitScale: null,
        onLoad: () => { clearTimeout(to); ok(); },
        onError: (m) => { clearTimeout(to); ng(new Error(m)); },
        onSlideChange: (i) => { cur = i; afterSlide(); },
      });
    });
    $("fileName").textContent = name;
    $("docSub").textContent = `슬라이드 ${count}장`;
    showStatus("");
    if (opts.restore > 0 && opts.restore < count) go(opts.restore);
    if (opts.persist !== false) saveLast(bytes, name, cur);
    refit(); setTimeout(refit, 150); setTimeout(refit, 600);   // 처음 열 때 화면 크기에 맞춤 (글꼴·썸네일이 늦게 자리 잡아도 다시 맞춤)
    afterSlide();
  } catch (e) {
    showStatus("이 파일을 열지 못했습니다. .pptx 파일인지 확인하세요. (" + (e?.message || e) + ")");
    $("count").textContent = "– / –";
  }
}

function go(i) {
  if (!pv || !count) return;
  i = Math.max(0, Math.min(count - 1, i));
  if (i === cur) { afterSlide(); return; }
  pv.goToSlide(i);                               // onSlideChange → afterSlide
}
function afterSlide() {
  if (lastSaved === name_()) saveSlide(cur);
  $("count").textContent = count ? `${cur + 1} / ${count}` : "– / –";
  $("fsCount").textContent = `${cur + 1} / ${count}` + (zoom > 1.01 ? ` · ${Math.round(zoom * 100)}%` : "");
  $("prev").disabled = cur === 0; $("next").disabled = cur >= count - 1;
  fsHitText();
  for (const b of $("resList").querySelectorAll("button")) b.setAttribute("aria-current", String(+b.dataset.i === cur));
  scheduleHL();
}

// ── 찾은 글자 표시: 뷰어가 그린 진짜 글자에 노란 표시(CSS Highlight), 그 글상자에 테두리 ─────────
let hlT = [];
function scheduleHL() { hlT.forEach(clearTimeout); hlT = [60, 300, 900].map((ms) => setTimeout(highlight, ms)); }
function highlight() {
  const slideEl = stage.querySelector(".pptxv-viewport .pptxv-stage");
  stage.querySelectorAll(".pv-hit").forEach((e) => e.classList.remove("pv-hit"));
  const ranges = [];
  if (query && slideEl) {
    for (const el of slideEl.querySelectorAll(".pptxv-element")) {
      if (!el.querySelector(".pptxv-element") && el.textContent.toLowerCase().includes(query)) el.classList.add("pv-hit");
    }
    const w = document.createTreeWalker(slideEl, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const s = n.nodeValue.toLowerCase();
      for (let k = s.indexOf(query); k >= 0; k = s.indexOf(query, k + query.length)) {
        const rg = new Range(); rg.setStart(n, k); rg.setEnd(n, k + query.length); ranges.push(rg);
      }
    }
  }
  hlCount = stage.querySelectorAll(".pv-hit").length;
  if (window.CSS?.highlights) { if (ranges.length) CSS.highlights.set("pv-hit", new Highlight(...ranges)); else CSS.highlights.delete("pv-hit"); }
}

// ── 크기·확대·전체화면 ─────────────────────────────────────
function isFull() { return document.fullscreenElement === viewer || viewer.classList.contains("full"); }
function sizeStage() {                          // 폰 보통 화면: 슬라이드 비율에 맞는 높이 / PC·전체화면: 남은 칸을 채움
  if (isFull() || innerWidth >= 900 || !parser) { stage.style.height = ""; return; }
  const { cx, cy } = parser.slideSize;
  stage.style.height = Math.max(MIN_STAGE_H, Math.round((stage.clientWidth - THUMB_W - 2 * FIT_PAD) * cy / cx + 2 * FIT_PAD)) + "px";
}
// 맞춤 배율을 직접 계산: 슬라이드 원래 크기(EMU → px, 96dpi) 가 보이는 칸(.pptxv-viewport)에 꼭 들어가는 배율.
// (뷰어 자체 zoomToFit 은 칸 크기가 바뀐 뒤에도 예전 크기로 계산해 전체화면에서 작게 남는 경우가 있었음)
function fitScale() {
  const vp = stage.querySelector(".pptxv-viewport");
  if (!vp || !parser) return fit || 1;
  const w = parser.slideSize.cx / 9525, h = parser.slideSize.cy / 9525;
  const r = vp.getBoundingClientRect();          // 확대 중 생긴 스크롤 막대를 빼지 않은 칸 크기
  const s = Math.min((r.width - 2 * FIT_PAD) / w, (r.height - 2 * FIT_PAD) / h);
  return s > 0.02 ? s : (fit || 1);
}
function zoomUI() {
  $("zoomLv").textContent = Math.round(zoom * 100) + "%";
  $("zoomOut").disabled = zoom <= ZMIN; $("zoomIn").disabled = zoom >= ZMAX;
  $("fsCount").textContent = `${cur + 1} / ${count}` + (zoom > 1.01 ? ` · ${Math.round(zoom * 100)}%` : "");
}
function refit() {                              // 칸 크기가 바뀌면 맞춤 배율을 다시 재고, 지금 확대 배수를 그대로 적용
  if (!pv) return;
  sizeStage();
  requestAnimationFrame(() => {
    fit = fitScale();
    pv.setZoom(fit * zoom);
    zoomUI(); scheduleHL();
  });
}
function setZoom(z, skipHL = false) {
  if (!pv) return;
  z = Math.min(ZMAX, Math.max(ZMIN, z));
  if (Math.abs(z - zoom) < 0.001 && z !== 1) return;
  zoom = z <= 1.001 ? 1 : z;
  if (zoom === 1) fit = fitScale();               // '맞춤'은 언제나 지금 칸 크기로 다시 계산
  pv.setZoom(fit * zoom);
  zoomUI();
  if (!skipHL) scheduleHL();
}
async function toggleFull() {
  if (isFull()) {
    if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
    viewer.classList.remove("full");
  } else {
    try { await viewer.requestFullscreen(); } catch { viewer.classList.add("full"); }
  }
  afterFull();
}
function afterFull() {
  closeMenu();
  if (!isFull()) $("fsSearch").hidden = true;
  const lb = isFull() ? "전체화면 끝" : "전체화면";
  $("fullBtn").setAttribute("aria-label", lb); $("fullBtn").title = lb;
  document.body.style.overflow = viewer.classList.contains("full") ? "hidden" : "";
  zoom = 1;
  refit(); setTimeout(refit, 150); setTimeout(refit, 500);   // 전체화면 전환 애니메이션이 끝난 뒤에도 다시 맞춤
}

// ── 전체화면 ⋮ 메뉴 ─────────────────────────────────────────
function closeMenu() { $("menu").hidden = true; $("moreBtn").setAttribute("aria-expanded", "false"); }
function openMenu() {
  for (const b of $("menu").querySelectorAll("[data-hits]")) b.hidden = hits.length < 1;
  $("menu").hidden = false; $("moreBtn").setAttribute("aria-expanded", "true");
  $("menu").querySelector("button:not([hidden])").focus();
}
// ── 전체화면 찾기 막대 ──────────────────────────────────────
function fsHitText() {
  const n = $("fsHitN");
  if (!query) { n.textContent = ""; }
  else if (!hits.length) { n.textContent = "없음"; }
  else { const k = hits.findIndex((h) => h.slideIndex === cur); n.textContent = `${k < 0 ? "–" : k + 1}/${hits.length}`; }
  $("fsHitPrev").disabled = $("fsHitNext").disabled = hits.length < 1;
}
function openFind() {
  closeMenu();
  $("fsSearch").hidden = false;
  $("fsQ").value = query ? $("q").value : $("fsQ").value;
  fsHitText(); $("fsQ").focus(); $("fsQ").select();
}
function closeFind() { $("fsSearch").hidden = true; $("fsFindBtn").focus(); }

async function menuAct(act) {
  closeMenu();
  if (act === "find") openFind();
  else if (act === "search") {                       // 전체화면을 끝내고 찾기 칸으로
    if (isFull()) await toggleFull();
    $("q").focus(); $("q").select(); $("searchForm").scrollIntoView({ block: "start" });
  } else if (act === "hitPrev") stepHit(-1);
  else if (act === "hitNext") stepHit(1);
  else if (act === "prev") go(cur - 1);
  else if (act === "next") go(cur + 1);
  else if (act === "zoomIn") setZoom(zoom * 1.25);
  else if (act === "zoomOut") setZoom(zoom / 1.25);
  else if (act === "fit") setZoom(1);
  else if (act === "exit" && isFull()) toggleFull();
}

// 슬라이드의 문단(a:p) 글자 목록 — 찾기는 문단 단위 (tools/search.mjs 와 같은 기준)
function paragraphs(i) {
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(parser._files[parser.slidePaths[i]]), "application/xml");
  return [...doc.getElementsByTagNameNS("*", "p")].filter((p) => p.namespaceURI?.includes("drawingml"))
    .map((p) => [...p.getElementsByTagNameNS("*", "t")].map((t) => t.textContent).join("")).filter((s) => s.trim());
}

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function search(q) {
  query = q.trim().toLowerCase();
  const list = $("resList"); list.replaceChildren();
  if (!parser || !query) { hits = []; showResults(false); afterSlide(); setTimeout(refit, 30); return; }
  hits = [];
  for (let i = 0; i < count; i++) {
    const ps = paragraphs(i), found = ps.filter((p) => p.toLowerCase().includes(query));
    if (found.length) hits.push({ slideIndex: i, title: ps[0] || "", lines: found.slice(0, 3), more: found.length - 3 });
  }
  const wasOpen = !$("results").hidden;
  showResults(true);
  if (!wasOpen) setTimeout(refit, 30);              // 결과 칸이 생기면 슬라이드 칸 폭이 바뀐다
  $("resTitle").textContent = hits.length ? `"${q.trim()}" — ${hits.length}개 슬라이드` : `"${q.trim()}" — 찾지 못했습니다`;
  $("hitPrev").disabled = $("hitNext").disabled = hits.length < 2;
  if (!hits.length) { list.innerHTML = '<li class="empty">다른 낱말로 찾아 보세요. 띄어쓰기도 그대로 맞춰 찾습니다.</li>'; afterSlide(); return; }
  for (const h of hits) {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.dataset.i = h.slideIndex;
    const mk = (s) => { const k = s.toLowerCase().indexOf(query); return esc(s.slice(0, k)) + "<mark>" + esc(s.slice(k, k + query.length)) + "</mark>" + esc(s.slice(k + query.length)); };
    const ex = h.lines.map(mk).join("<br>") + (h.more > 0 ? `<br>… 외 ${h.more}곳` : "");
    b.innerHTML = `<span class="no">${h.slideIndex + 1}쪽</span><span class="ex">${h.lines[0] !== h.title ? `<b>${esc(h.title)}</b><br>` : ""}${ex}</span>`;
    b.addEventListener("click", () => { hitPos = hits.indexOf(h); go(h.slideIndex); if (innerWidth < 900) stage.scrollIntoView({ block: "nearest" }); });
    li.append(b); list.append(li);
  }
  hitPos = Math.max(0, hits.findIndex((h) => h.slideIndex >= cur));
  go(hits[hitPos].slideIndex);
  afterSlide();
}

function stepHit(d) { if (!hits.length) return; hitPos = (hitPos + d + hits.length) % hits.length; go(hits[hitPos].slideIndex); }

// 파일 고르기: 고르는 창에는 .pptx 만 보이게 하고(accept, 2026-10-20 사용자 요청), 끌어다 놓기 등으로 들어온 파일은 여기서 한 번 더 확인한다
function pick(f) {
  if (!f) return;
  if (!/\.pptx$/i.test(f.name)) { showStatus(`"${f.name}" 은(는) .pptx 파일이 아닙니다. .pptx 파일을 골라 주세요.`); return; }
  open(f, f.name);
}
// 파일 고르는 창: 가능하면(PC 크롬·엣지 등) .pptx 만 보이는 전용 창을 쓰고, 안 되는 브라우저는 기본 창(accept 지정)을 쓴다
let nativePicker = "showOpenFilePicker" in window;
if (nativePicker) {
  $("fileIn").addEventListener("click", async (e) => {
    if (!nativePicker) return;
    e.preventDefault();
    try {
      const [h] = await window.showOpenFilePicker({ multiple: false, excludeAcceptAllOption: true,
        types: [{ description: "PowerPoint (.pptx)", accept: { "application/vnd.openxmlformats-officedocument.presentationml.presentation": [".pptx"] } }] });
      pick(await h.getFile());
    } catch (err) { if (err?.name !== "AbortError") { nativePicker = false; $("fileIn").click(); } }
  });
}
$("fileIn").addEventListener("change", (e) => { pick(e.target.files[0]); e.target.value = ""; });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); pick(e.dataTransfer?.files?.[0]); });
$("searchForm").addEventListener("submit", (e) => { e.preventDefault(); clearTimeout(liveT); search($("q").value); $("q").blur(); });
// 글자를 칠 때마다 바로 찾기 (2026-10-21 사용자 요청, 한글 조합 중에도 / 짧게 기다렸다 한 번만)
let liveT;
$("q").addEventListener("input", () => { clearTimeout(liveT); liveT = setTimeout(() => search($("q").value), 200); });
$("prev").addEventListener("click", () => go(cur - 1));
$("next").addEventListener("click", () => go(cur + 1));
$("zoomIn").addEventListener("click", () => setZoom(zoom * 1.25));
$("zoomOut").addEventListener("click", () => setZoom(zoom / 1.25));
$("zoomFit").addEventListener("click", () => setZoom(1));
$("fullBtn").addEventListener("click", toggleFull);
$("fsFindBtn").addEventListener("click", (e) => { e.stopPropagation(); $("fsSearch").hidden ? openFind() : closeFind(); });
$("fsSearch").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("q").value = $("fsQ").value;                 // 보통 화면 찾기 칸·결과 목록과 같이 맞춘다
  await search($("fsQ").value);
  fsHitText();
});
$("fsQ").addEventListener("input", () => {
  clearTimeout(liveT);
  liveT = setTimeout(async () => { $("q").value = $("fsQ").value; await search($("fsQ").value); fsHitText(); }, 200);
});
$("fsHitPrev").addEventListener("click", () => stepHit(-1));
$("fsHitNext").addEventListener("click", () => stepHit(1));
$("fsFindClose").addEventListener("click", closeFind);
$("fsQ").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeFind(); } });
$("moreBtn").addEventListener("click", (e) => { e.stopPropagation(); $("menu").hidden ? openMenu() : closeMenu(); });
$("menu").addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b) menuAct(b.dataset.act); });
document.addEventListener("click", (e) => { if (!$("menu").hidden && !e.target.closest("#fsbar")) closeMenu(); });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) viewer.classList.remove("full"); afterFull(); });
// Ctrl+휠 확대는 이 화면의 확대 단계로 (뷰어 자체 확대보다 먼저 잡는다)
stage.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault(); e.stopPropagation();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, { passive: false, capture: true });
$("hitPrev").addEventListener("click", () => stepHit(-1));
$("hitNext").addEventListener("click", () => stepHit(1));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.isContentEditable) return;
  const inViewer = !!e.target.closest?.(".pptxv");   // 뷰어에 초점이 있으면 화살표는 뷰어가 직접 처리 (두 번 넘어가지 않게)
  if (!inViewer && (e.key === "ArrowLeft" || e.key === "PageUp")) go(cur - 1);
  if (!inViewer && (e.key === "ArrowRight" || e.key === "PageDown")) go(cur + 1);
  if (e.key === "+" || e.key === "=") setZoom(zoom * 1.25);
  if (e.key === "-") setZoom(zoom / 1.25);
  if (e.key === "0") setZoom(1);
  if (e.key === "f" || e.key === "F") toggleFull();
  if (e.key === "Escape" && !$("menu").hidden) { closeMenu(); $("moreBtn").focus(); return; }
  if (e.key === "Escape" && viewer.classList.contains("full")) toggleFull();
});
// 터치: 두 손가락 핀치 줌(손가락 움직임을 그대로 따라 연속으로 확대·축소, 손을 떼면 그 배율로 확정), 확대 중 한 손가락 드래그(화면 이동), 맞춤 중 한 손가락 좌우 밀기(쪽 넘김), 더블 탭(확대/맞춤)
// 핀치 중에는 뷰어를 다시 그리지 않고 CSS transform 만 바꿔 손가락을 즉시 따라가게 하고, 손을 뗄 때 setZoom 으로 한 번만 확정한다.
let touchState = null, pinchLive = null;
let lastTapTime = 0, lastTapPos = { x: 0, y: 0 };

const getVp = () => stage.querySelector(".pptxv-viewport");
const getWrap = () => stage.querySelector(".pptxv-stage-wrap");
const touchDist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
const touchMid = (t1, t2) => ({ x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 });
const clampZ = (z) => Math.min(ZMAX, Math.max(ZMIN, z));

// 화면 좌표 (x, y) 에 있는 슬라이드 지점이 확대 후 (toX, toY) 에 오도록 배율을 바꾸고 스크롤을 맞춘다
function zoomAt(z, x, y, toX = x, toY = y) {
  const vp = getVp(), wrap = getWrap();
  z = clampZ(z);
  if (!vp || !wrap) { setZoom(z); return; }
  const vr = vp.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const px = x - wr.left, py = y - wr.top;       // 슬라이드 칸 안에서의 위치
  const wl = wr.left - vr.left + vp.scrollLeft, wt = wr.top - vr.top + vp.scrollTop;
  const ratio = z / zoom;
  setZoom(z);
  vp.scrollLeft = wl + px * ratio - (toX - vr.left);
  vp.scrollTop = wt + py * ratio - (toY - vr.top);
}
function endPinchLive(commit) {
  const L = pinchLive; pinchLive = null;
  const wrap = getWrap();
  if (wrap) { wrap.style.transform = ""; wrap.style.transformOrigin = ""; wrap.style.willChange = ""; }
  if (L && commit) { zoomAt(L.z, L.start.x, L.start.y, L.mid.x, L.mid.y); scheduleHL(); }
}

// 슬라이드 뷰어 안쪽 라이브러리(pptx-vanilla-viewer)도 자기 핀치·밀기 처리를 따로 갖고 있어(핀치마다 슬라이드를 다시 그림) 같이 반응하면 서로 방해한다.
// 슬라이드 칸의 터치는 여기서만 처리하고 안쪽으로 전달하지 않는다 (2026-10-21 사용자: 핀치 한 번에 3~5%만 확대되는 문제의 원인).
stage.addEventListener("touchstart", (e) => {
  e.stopPropagation();
  if (e.target.closest?.(".pptxv-thumbs")) { touchState = null; return; }   // 썸네일 줄은 브라우저가 밀기(스크롤)·누르기를 처리
  if (e.touches.length === 2) {
    e.preventDefault();
    const m = touchMid(e.touches[0], e.touches[1]);
    touchState = { mode: "pinch", startDist: Math.max(touchDist(e.touches[0], e.touches[1]), 10), baseZoom: zoom, start: m };
    const wrap = getWrap();
    if (wrap) {
      const wr = wrap.getBoundingClientRect();
      wrap.style.transformOrigin = `${m.x - wr.left}px ${m.y - wr.top}px`;
      wrap.style.willChange = "transform";
    }
    pinchLive = { z: zoom, start: m, mid: m };
  } else if (e.touches.length === 1) {
    const vp = getVp(), t = e.touches[0];
    touchState = { mode: zoom > 1.01 ? "pan" : "swipe", startX: t.clientX, startY: t.clientY, startTime: Date.now(),
      scroll: vp ? { l: vp.scrollLeft, t: vp.scrollTop } : { l: 0, t: 0 } };
  }
}, { passive: false, capture: true });

window.addEventListener("touchmove", (e) => {
  if (stage.contains(e.target)) e.stopPropagation();
  if (!touchState) return;
  const vp = getVp();
  if (e.touches.length === 2 && touchState.mode === "pinch" && pinchLive) {
    e.preventDefault();
    const d = touchDist(e.touches[0], e.touches[1]);
    const m = touchMid(e.touches[0], e.touches[1]);
    const z = clampZ(touchState.baseZoom * d / touchState.startDist);   // 거리 비율 그대로 (단계 없이 연속)
    pinchLive = { z, start: touchState.start, mid: m };
    const wrap = getWrap();
    if (wrap) wrap.style.transform = `translate(${m.x - touchState.start.x}px, ${m.y - touchState.start.y}px) scale(${z / zoom})`;
    $("zoomLv").textContent = Math.round(z * 100) + "%";
  } else if (e.touches.length === 1 && touchState.mode === "pan" && vp) {
    e.preventDefault();
    const t = e.touches[0];
    vp.scrollLeft = touchState.scroll.l - (t.clientX - touchState.startX);
    vp.scrollTop = touchState.scroll.t - (t.clientY - touchState.startY);
  }
}, { passive: false, capture: true });

const endTouch = (e) => {
  if (stage.contains(e.target)) e.stopPropagation();
  if (!touchState) return;
  const vp = getVp();

  if (touchState.mode === "pinch") {
    if (e.touches.length >= 2) return;
    endPinchLive(e.type !== "touchcancel");
    if (e.touches.length === 1) {                // 한 손가락이 남으면 이어서 화면 이동
      const t = e.touches[0];
      touchState = { mode: "pan", startX: t.clientX, startY: t.clientY, startTime: 0, moved: true,
        scroll: vp ? { l: vp.scrollLeft, t: vp.scrollTop } : { l: 0, t: 0 } };
      return;
    }
  } else if ((touchState.mode === "swipe" || touchState.mode === "pan") && e.changedTouches.length && e.type === "touchend") {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchState.startX;
    const dy = t.clientY - touchState.startY;
    const dt = Date.now() - (touchState.startTime || 0);

    if (touchState.mode === "swipe" && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 450) {
      go(cur + (dx < 0 ? 1 : -1));
    } else if (touchState.mode === "pan" && touchState.startTime && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < 250) {
      setZoom(1);                                // 확대 중 빠르게 휙 넘기면: 창에 맞춤으로 되돌리고 다음(이전) 쪽으로 (천천히 끌면 화면 이동)
      go(cur + (dx < 0 ? 1 : -1));
    } else if (touchState.startTime && Math.hypot(dx, dy) < 15 && dt < 300) {
      const now = Date.now();
      if (now - lastTapTime < 320 && Math.hypot(t.clientX - lastTapPos.x, t.clientY - lastTapPos.y) < 25) {
        zoomAt(zoom > 1.05 ? 1 : 2.5, t.clientX, t.clientY);
        scheduleHL();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapPos = { x: t.clientX, y: t.clientY };
      }
    }
  }
  if (e.touches.length === 0) touchState = null;
};

window.addEventListener("touchend", endTouch, { capture: true });
window.addEventListener("touchcancel", endTouch, { capture: true });

// 썸네일 줄: 안쪽 라이브러리가 썸네일 위의 손가락 포인터를 따로 붙잡아(끌어 옮기기용) 손가락으로 밀어도 목록이 안 움직였다 → 손가락 포인터는 전달하지 않고 누르기(click)만 남긴다
for (const ev of ["pointerdown", "pointermove", "pointerup"]) {
  stage.addEventListener(ev, (e) => { if (e.pointerType === "touch" && e.target.closest?.(".pptxv-thumbs")) e.stopPropagation(); }, true);
}
// iOS 사파리의 기본 제스처 줌만 막는다 (핀치 자체는 위 touch 이벤트로 처리)
for (const ev of ["gesturestart", "gesturechange", "gestureend"]) stage.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(refit, 150); });
// 칸 크기가 바뀌면(결과 칸 열림·폰 회전·주소창 접힘 등) 자동으로 다시 맞춤
if ("ResizeObserver" in window) {
  let ro; new ResizeObserver(() => { clearTimeout(ro); ro = setTimeout(refit, 80); }).observe(stage);
}

// ── 앱 설치 (2026-10-20 사용자 요청: 크롬 메뉴 설치가 제대로 안 돼 화면 안 설치 버튼) ─────────
// 크롬·엣지·삼성 인터넷: beforeinstallprompt 로 받은 설치 창을 버튼에서 띄운다. 아이폰·아이패드는 직접 띄울 수 없어 방법을 보여 준다.
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: window-controls-overlay)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installEvt = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3500); }
function installHelp(steps) {
  $("installSteps").innerHTML = steps.map((s) => `<li>${s}</li>`).join("");
  $("installHelp").showModal ? $("installHelp").showModal() : ($("installHelp").open = true);
}
const hasManifest = !!document.querySelector('link[rel="manifest"]');
if (hasManifest && !isStandalone() && isIOS) $("installBtn").hidden = false;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (!isStandalone()) $("installBtn").hidden = false; });
window.addEventListener("appinstalled", () => { installEvt = null; $("installBtn").hidden = true; toast("앱을 설치했습니다. 홈 화면(또는 시작 메뉴)에서 '슬라이드 찾기'로 여세요."); });
$("installBtn").addEventListener("click", async () => {
  if (installEvt && !isIOS) {
    try {
      installEvt.prompt();
      const { outcome } = await installEvt.userChoice;
      installEvt = null;
      if (outcome === "accepted") $("installBtn").hidden = true;
      return;
    } catch { installEvt = null; }               // 설치 창을 못 띄우면 아래 안내로
  }
  if (isIOS) {
    installHelp(["Safari 로 이 페이지를 엽니다 (다른 앱 안의 브라우저에서는 설치가 안 됩니다)",
      "아래(아이패드는 위) <b>공유 버튼</b>(네모에서 위 화살표)을 누릅니다", "<b>홈 화면에 추가</b>를 고른 뒤 <b>추가</b>를 누릅니다"]);
  } else {
    installHelp(["주소창 오른쪽의 <b>설치</b> 아이콘이나 브라우저 메뉴(⋮)의 <b>앱 설치</b>를 누릅니다",
      "보이지 않으면 페이지를 한 번 새로고침한 뒤 다시 눌러 보세요", "카톡·밴드 같은 앱 안의 브라우저라면 <b>크롬으로 열기</b>를 먼저 하세요"]);
  }
});
$("installHelpClose").addEventListener("click", () => $("installHelp").close());

// 서비스 워커: 앱 파일 보관(빠른 실행·인터넷 없이 열기) + 공유로 받은 파일 전달. 새 판이 오면 다음 실행부터 적용
if (hasManifest && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // 이미 열려 있던 앱(홈 화면 앱을 닫지 않고 다시 연 경우)은 옛 코드로 계속 돌아가므로, 새 판이 넘겨받으면 한 번 다시 불러온다 (손가락이 닿아 있는 동안은 제외)
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!touchState) location.reload(); }, { once: true });
  }
}
// 설치한 앱으로 .pptx 를 열었을 때 (PC: 파일을 두 번 누르기·연결 프로그램)
if ("launchQueue" in window) {
  window.launchQueue.setConsumer(async (p) => { const h = p.files?.[0]; if (h) { const f = await h.getFile(); pick(f); } });
}
// 다른 앱에서 '공유'로 보낸 파일 (폰: 카톡 등 → 공유 → 슬라이드 찾기)
async function openShared() {
  if (!new URLSearchParams(location.search).has("shared") || !("caches" in window)) return false;
  history.replaceState(null, "", location.pathname);
  const c = await caches.open("pv-share"), res = await c.match("shared-file");
  if (!res) { toast("공유한 파일을 받지 못했습니다. 파일 열기로 골라 주세요."); return false; }
  await c.delete("shared-file");
  const name = decodeURIComponent(res.headers.get("X-File-Name") || "공유받은 파일.pptx");
  open(new File([await res.blob()], name), name);   // 공유 앱이 확장자를 빼고 보내는 경우가 있어 이름 검사 없이 연다
  return true;
}

// 에이전트·시험용 조작 (headless): window.pptxViewer.search("매출") 등
window.pptxViewer = { open, search, go, setZoom, toggleFull, menu: menuAct, openFind, get viewer() { return pv; },
  get state() { return { slide: cur, count, query, hits: hits.map((h) => h.slideIndex), zoom: +zoom.toFixed(2), full: isFull(),
    highlighted: hlCount, marks: CSS.highlights?.get("pv-hit")?.size ?? 0, fit: +fit.toFixed(3), fitNow: +fitScale().toFixed(3) }; } };

const bin = Uint8Array.from(atob(SAMPLE_B64), (c) => c.charCodeAt(0));
openShared().then(async (got) => { if (got) return; if (!(await openLast())) { curName = ""; open(bin, "예시 발표자료", { persist: false }); } });
</script>
