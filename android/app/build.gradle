plugins { id 'com.android.application' }

android {
    namespace 'kr.pptxviewer'
    compileSdk 34
    defaultConfig {
        applicationId 'kr.pptxviewer.slidefinder'
        minSdk 24
        targetSdk 34
        def run = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode = Integer.parseInt(run)
        versionName = '1.' + run
    }
    signingConfigs {
        release {
            // 키는 GitHub 저장소 시크릿에서 워크플로가 파일로 풀어 준다 (.github/workflows/android.yml)
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'pv'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
